backend:
  name: github
  repo: trauermosaik/website
  branch: main
  base_url: https://trauermosaik-auth.verein.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "pages"
    label: "Statische Seiten"
    files:
      - file: "content/index.md"
        label: "Startseite"
        name: "index"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layout.njk" }
          - label: "Farbton"
            name: "farbton"
            widget: "select"
            default: "allgemein"
            options:
              - { label: "Allgemein – Nachtpetrol", value: "allgemein" }
              - { label: "Gesellschaft – Morgengold", value: "gesellschaft" }
              - { label: "Trauernde – Erdrot", value: "trauernde" }
              - { label: "Unterstützende – Hoffnungsgrün", value: "unterstuetzende" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Einleitungstext", name: "lead", widget: "text", required: false }
          - { label: "SEO Meta Titel", name: "meta_title", widget: "string", required: false }
          - { label: "SEO Meta Beschreibung", name: "meta_description", widget: "text", required: false }
          - { label: "Hauptinhalt", name: "body", widget: "markdown" }

      - file: "content/ueber-uns.md"
        label: "Über uns"
        name: "ueber_uns"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layout.njk" }
          - label: "Farbton"
            name: "farbton"
            widget: "select"
            default: "allgemein"
            options:
              - { label: "Allgemein – Nachtpetrol", value: "allgemein" }
              - { label: "Gesellschaft – Morgengold", value: "gesellschaft" }
              - { label: "Trauernde – Erdrot", value: "trauernde" }
              - { label: "Unterstützende – Hoffnungsgrün", value: "unterstuetzende" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Einleitungstext", name: "lead", widget: "text", required: false }
          - { label: "SEO Meta Titel", name: "meta_title", widget: "string", required: false }
          - { label: "SEO Meta Beschreibung", name: "meta_description", widget: "text", required: false }
          - { label: "Hauptinhalt", name: "body", widget: "markdown" }

      - file: "content/formate.md"
        label: "Formate & Angebote"
        name: "formate"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layout.njk" }
          - label: "Farbton"
            name: "farbton"
            widget: "select"
            default: "trauernde"
            options:
              - { label: "Allgemein – Nachtpetrol", value: "allgemein" }
              - { label: "Gesellschaft – Morgengold", value: "gesellschaft" }
              - { label: "Trauernde – Erdrot", value: "trauernde" }
              - { label: "Unterstützende – Hoffnungsgrün", value: "unterstuetzende" }
