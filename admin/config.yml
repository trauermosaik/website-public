      - file: "content/neuigkeiten.md"
        label: "Neuigkeiten (Übersicht)"
        name: "neuigkeiten"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "news-list.njk" }
          - label: "Farbton"
            name: "farbton"
            widget: "select"
            default: "allgemein"
            options:
              - { label: "Allgemein – Nachtpetrol", value: "allgemein" }
              - { label: "Gesellschaft – Morgengold", value: "gesellschaft" }
              - { label: "Trauernde – Erdrot", value: "trauernde" }
              - { label: "Unterstützende – Hoffnungsgrün", value: "unterstuetzende" }
