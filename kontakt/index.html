<form action="https://form.taxi" method="POST">
<p><label for="name">Name:</label>
<input type="text" name="name" id="name" required></p>
<p><label for="email">E-Mail-Adresse:</label>
<input type="email" name="email" id="email" required></p>
<p><label for="nachricht">Nachricht / Anmerkung:</label></p>
  <textarea name="nachricht" id="nachricht" rows="5"></textarea>
  <input type="text" name="_gotcha" style="display:none">
<p><button type="submit">Mitgliedsantrag absenden</button></p>
</form>
